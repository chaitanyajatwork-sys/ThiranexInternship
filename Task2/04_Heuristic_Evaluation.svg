<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<rect width="1200" height="820" fill="#F8FAFC"/>
<text x="60" y="55" font-family="Arial" font-size="30" font-weight="700" fill="#0F172A">AirSense AI — Heuristic Evaluation</text>
<text x="60" y="84" font-family="Arial" font-size="16" fill="#64748B">Sample audit used to guide the redesign</text>
<rect x="60" y="125" width="1080" height="100" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="85" y="157" font-family="Arial" font-size="18" font-weight="700" fill="#2563EB">High — Information hierarchy</text>
<text x="85" y="187" font-family="Arial" font-size="15" fill="#334155">Primary status competes with secondary content → make AQI dominant</text>
<rect x="60" y="245" width="1080" height="100" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="85" y="277" font-family="Arial" font-size="18" font-weight="700" fill="#2563EB">Medium — Dense content</text>
<text x="85" y="307" font-family="Arial" font-size="15" fill="#334155">Too many competing cards → group information by user task</text>
<rect x="60" y="365" width="1080" height="100" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="85" y="397" font-family="Arial" font-size="18" font-weight="700" fill="#2563EB">High — Unclear next action</text>
<text x="85" y="427" font-family="Arial" font-size="15" fill="#334155">Data is visible but action is unclear → add contextual health CTA</text>
<rect x="60" y="485" width="1080" height="100" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="85" y="517" font-family="Arial" font-size="18" font-weight="700" fill="#2563EB">Medium — Inconsistent spacing</text>
<text x="85" y="547" font-family="Arial" font-size="15" fill="#334155">Uneven spacing → use an 8px spacing system</text>
<rect x="60" y="605" width="1080" height="100" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="85" y="637" font-family="Arial" font-size="18" font-weight="700" fill="#2563EB">Medium — Responsive prioritization</text>
<text x="85" y="667" font-family="Arial" font-size="15" fill="#334155">Mobile needs stronger hierarchy → stack cards and keep AQI above fold</text>
<rect x="60" y="725" width="1080" height="100" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
<text x="85" y="757" font-family="Arial" font-size="18" font-weight="700" fill="#2563EB">Medium — Accessibility</text>
<text x="85" y="787" font-family="Arial" font-size="15" fill="#334155">Status should not rely on color → add labels/icons and visible states</text>
</svg>